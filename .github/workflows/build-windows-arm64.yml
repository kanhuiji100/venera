name: Build Windows ARM64

# 为什么需要这套流程：
# flutter build windows 的目标架构不是命令行参数，而是由宿主架构硬编码决定的
#   packages/flutter_tools/lib/src/commands/build_windows.dart
#   => os.hostPlatform == HostPlatform.windows_arm64 ? windows-arm64 : windows-x64
# 而 hostPlatform 在 Windows 上取自 Dart VM 的 Abi.current()，即"跑 flutter 工具的那个 dart.exe 的架构"。
# 官方 Windows Flutter SDK 只发布 x64 版本，在 ARM64 机器上即使原生/模拟运行也只会报 windows_x64。
# 因此：在原生 ARM64 运行器上，把 SDK 里的 dart-sdk 换成 dart-archive 的 windows-arm64 版本，
#       并强制重建 flutter_tools 快照，flutter 才会走 -A ARM64 + windows-arm64 引擎产物。

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter stable version (必须 >= 3.44，3.41/3.42/3.43 没有 windows-arm64 引擎产物)'
        required: false
        default: '3.44.9'
      dart_version:
        description: '该 Flutter 版本自带的 Dart SDK 版本（须与 Flutter 一致）'
        required: false
        default: '3.12.2'
      build_installer:
        description: '是否同时构建 Inno Setup 安装包'
        required: false
        default: 'true'

env:
  FLUTTER_HOME: C:\flutter_sdk

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: 确认宿主是原生 ARM64
        shell: pwsh
        run: |
          "PROCESSOR_ARCHITECTURE : $env:PROCESSOR_ARCHITECTURE"
          "PROCESSOR_IDENTIFIER   : $env:PROCESSOR_IDENTIFIER"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "运行器不是原生 ARM64，无法产出 ARM64 构建"
          }

      - name: 缓存 Flutter SDK 与 pub 缓存
        uses: actions/cache@v4
        with:
          path: |
            C:\flutter_sdk
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: arm64-flutter-${{ inputs.flutter_version }}-dart-${{ inputs.dart_version }}-v2

      - name: 准备 Flutter SDK（换入原生 arm64 Dart）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterV = "${{ inputs.flutter_version }}"
          $dartV    = "${{ inputs.dart_version }}"
          $cache    = Join-Path $env:FLUTTER_HOME 'bin\cache'
          $dartExe  = Join-Path $cache 'dart-sdk\bin\dart.exe'

          if ((Test-Path (Join-Path $env:FLUTTER_HOME 'version')) -and (Test-Path $dartExe)) {
            Write-Host "命中缓存，跳过下载。SDK 版本: $((Get-Content (Join-Path $env:FLUTTER_HOME 'version') -Raw).Trim())"
          } else {
            $zip = Join-Path $env:RUNNER_TEMP "flutter_windows_$flutterV.zip"
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$flutterV-stable.zip"
            Write-Host "下载 $url"
            Invoke-WebRequest $url -OutFile $zip
            Write-Host ("大小 {0:N0} MB" -f ((Get-Item $zip).Length / 1MB))
            tar -xf $zip -C "C:\"          # 解压出 C:\flutter
            if (Test-Path $env:FLUTTER_HOME) { Remove-Item -Recurse -Force $env:FLUTTER_HOME }
            Move-Item "C:\flutter" $env:FLUTTER_HOME

            # 旧的 flutter_tools 快照是 x64 的 app-jit 快照，arm64 VM 无法加载，必须删掉让它重建
            Remove-Item -Force -ErrorAction SilentlyContinue `
              (Join-Path $cache 'flutter_tools.snapshot'), (Join-Path $cache 'flutter_tools.stamp')
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $cache 'dart-sdk')

            $dartZip = Join-Path $env:RUNNER_TEMP "dartsdk-$dartV-arm64.zip"
            Invoke-WebRequest "https://storage.googleapis.com/dart-archive/channels/stable/release/$dartV/sdk/dartsdk-windows-arm64-release.zip" -OutFile $dartZip
            # 归档根目录就是 dart-sdk/，解到 cache 下即可
            tar -xf $dartZip -C $cache

            # 把缓存戳写成引擎版本号，否则启动脚本会认为 Dart SDK 过期而重新拉取 x64 版本
            $engine = (Get-Content (Join-Path $env:FLUTTER_HOME 'bin\internal\engine.version') -Raw).Trim()
            Set-Content (Join-Path $cache 'engine.stamp')          -Value $engine -NoNewline -Encoding ascii
            Set-Content (Join-Path $cache 'engine-dart-sdk.stamp') -Value $engine -NoNewline -Encoding ascii
          }

          # 硬校验：flutter 工具的架构判定完全依赖这个 dart.exe，必须是 windows_arm64
          $out = (& $dartExe --version 2>&1) -join ' '
          Write-Host "dart: $out"
          if ($out -notmatch 'windows_arm64') { throw "Dart SDK 不是 windows_arm64，架构判定会退化成 x64：$out" }

      - name: 初始化 flutter（重建工具快照 + 预取 arm64 引擎产物）
        shell: pwsh
        run: |
          $env:Path = "$env:FLUTTER_HOME\bin;$env:Path"
          "$env:FLUTTER_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          flutter --version
          flutter config --no-analytics | Out-Null
          # precache 会按宿主架构下载 windows-arm64 的 flutter_windows.dll / gen_snapshot 等
          flutter precache --windows
          Write-Host "--- 已缓存的 windows 引擎产物 ---"
          Get-ChildItem "$env:FLUTTER_HOME\bin\cache\artifacts\engine" -Directory |
            Where-Object Name -like 'windows*' | Select-Object -ExpandProperty Name

      - name: 对齐 pubspec 的 Flutter 版本约束
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "${{ inputs.flutter_version }}"
          $c = Get-Content pubspec.yaml -Raw
          # 注意：替换串必须用单引号拼接，双引号里的 ${1} 会被 PowerShell 当成变量展开
          $new = [regex]::Replace($c, '(?m)^(\s+flutter:\s*)\d[\w.\-+]*\s*$', '${1}' + $v)
          if ($new -eq $c) { Write-Warning '未找到 environment.flutter 版本约束，跳过' }
          Set-Content pubspec.yaml -Value $new -NoNewline
          Select-String pubspec.yaml -Pattern '^environment:' -Context 0,2

      - name: flutter pub get
        shell: pwsh
        run: |
          $env:Path = "$env:FLUTTER_HOME\bin;$env:Path"
          flutter pub get

      - name: 修补 cargokit 的符号链接解析脚本
        shell: pwsh
        run: |
          # cargokit 的 cmake/resolve_symlinks.ps1 逐个路径段调用 Get-Item，但 Windows 下
          # 对隐藏目录（如 C:\Users\<user>\AppData）不加 -Force 就会抛 "找不到项"，
          # 导致 rhttp_cargokit 的自定义构建以 -1 退出。
          $ErrorActionPreference = 'Stop'
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA 'Pub\Cache' }
          Write-Host "PUB_CACHE = $cache"

          $files = @(Get-ChildItem -Path $cache -Recurse -Filter 'resolve_symlinks.ps1' -File -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like '*cargokit*' })
          if ($files.Count -eq 0) { Write-Warning '未找到 cargokit 的 resolve_symlinks.ps1，跳过'; exit 0 }

          $rep = { param($m) 'Get-Item -LiteralPath $realPath -Force -ErrorAction SilentlyContinue' }
          foreach ($f in $files) {
            $c = Get-Content $f.FullName -Raw
            if ($c -match '-LiteralPath \$realPath -Force') { Write-Host "已修补过: $($f.FullName)"; continue }
            $new = [regex]::Replace($c, 'Get-Item\s+\$realPath', $rep)
            if ($new -eq $c) { Write-Warning "未匹配到目标语句: $($f.FullName)"; continue }
            Set-Content $f.FullName -Value $new -NoNewline
            Write-Host "已修补: $($f.FullName)"
          }

          # 冒烟测试：脚本用 Write-Host 输出，直接让它打进日志（不要用管道捕获）
          Write-Host "--- 冒烟测试 ---"
          & $files[0].FullName $cache

          # ---- 2. rhttp 内置的 cargokit 版本过旧，target.dart 里没有 windows-arm64 映射 ----
          # 不补的话 build_tool 会抛 "Unknown target platform: windows-arm64"
          $targets = @(Get-ChildItem -Path $cache -Recurse -Filter 'target.dart' -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -like '*cargokit*build_tool*target.dart' })
          if ($targets.Count -eq 0) { Write-Warning '未找到 cargokit 的 target.dart，跳过'; exit 0 }

          $needle = "flutter: 'windows-x64',"
          $close  = '    ),'
          foreach ($t in $targets) {
            $c = Get-Content $t.FullName -Raw
            if ($c -match "windows-arm64") { Write-Host "已包含 windows-arm64: $($t.FullName)"; continue }
            $i = $c.IndexOf($needle)
            if ($i -lt 0) { Write-Warning "未找到 windows-x64 锚点: $($t.FullName)"; continue }
            $j = $c.IndexOf($close, $i)
            if ($j -lt 0) { Write-Warning "未找到块结尾: $($t.FullName)"; continue }
            $nl = if ($c.Contains("`r`n")) { "`r`n" } else { "`n" }
            $insert = "$nl    Target($nl      rust: 'aarch64-pc-windows-msvc',$nl      flutter: 'windows-arm64',$nl    ),"
            $new = $c.Substring(0, $j + $close.Length) + $insert + $c.Substring($j + $close.Length)
            Set-Content $t.FullName -Value $new -NoNewline
            Write-Host "已补 aarch64-pc-windows-msvc 映射: $($t.FullName)"
          }
          foreach ($t in $targets) {
            if ((Get-Content $t.FullName -Raw) -notmatch 'windows-arm64') { throw "target.dart 修补失败: $($t.FullName)" }
          }

      - name: Rust 环境诊断与目标补齐
        shell: pwsh
        run: |
          Write-Host "--- rustc ---"
          rustc -vV
          Write-Host "--- rustup show ---"
          rustup show
          Write-Host "--- 已安装 target ---"
          rustup target list --installed
          Write-Host "--- link.exe ---"
          (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          Write-Host "--- 补齐 aarch64-pc-windows-msvc ---"
          rustup target add aarch64-pc-windows-msvc 2>&1 | ForEach-Object { $_.ToString() }
          rustup target list --installed

      - name: flutter build windows --release
        shell: pwsh
        env:
          # VS2026 (MSVC 14.51) 把 <experimental/coroutine>（C++/WinRT 间接引入）的弃用
          # 从警告升级成了 error C2338 / STL1011，flutter_inappwebview、local_auth 会挂。
          # _CL_ 是 MSVC 的"追加命令行参数"环境变量，cl.exe 会把它拼到每次编译后面。
          _CL_: '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
        run: |
          $env:Path = "$env:FLUTTER_HOME\bin;$env:Path"
          Write-Host "_CL_ = $env:_CL_"
          # -v 以便看到 cargokit / cargo 的真实输出（MSBuild 默认会吞掉自定义命令的 stdout）
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath build-verbose.log
          if ($LASTEXITCODE -ne 0) { throw "flutter build 失败，退出码 $LASTEXITCODE" }
          Write-Host "--- 产物目录 ---"
          Get-ChildItem build\windows -Directory | Select-Object -ExpandProperty Name

      - name: 打包 zip 并校验 PE 架构
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\arm64\runner\Release'
          if (-not (Test-Path $releaseDir)) { throw "未找到 ARM64 产物目录 $releaseDir" }

          $exe = Join-Path $releaseDir 'venera.exe'
          $bytes   = [IO.File]::ReadAllBytes($exe)
          $peOff   = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("venera.exe PE machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0xAA64) { throw ("产物不是 ARM64（machine=0x{0:X4}），构建失败" -f $machine) }
          foreach ($dll in 'flutter_windows.dll') {
            $p = Join-Path $releaseDir $dll
            $b = [IO.File]::ReadAllBytes($p); $o = [BitConverter]::ToInt32($b, 0x3C)
            Write-Host ("{0} machine = 0x{1:X4}" -f $dll, [BitConverter]::ToUInt16($b, $o + 4))
          }

          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force build\dist | Out-Null
          $zipPath = "build\dist\Venera-$ver-windows-arm64.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host ("zip: {0} ({1:N1} MB)" -f $zipPath, ((Get-Item $zipPath).Length / 1MB))

      - name: 构建安装包（可选）
        if: ${{ inputs.build_installer == 'true' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1).FullName
          if (-not $iscc) { Write-Warning '未找到 ISCC.exe，跳过安装包'; exit 0 }
          Write-Host "使用 $iscc"

          $ver = $env:VERSION
          $iss = 'windows\build_arm64.iss'
          $orig = Get-Content $iss -Raw
          $patched = $orig.Replace('{{version}}', $ver).Replace('{{root_path}}', (Get-Location).Path)
          Set-Content $iss -Value $patched -NoNewline
          try {
            & $iscc $iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC 退出码 $LASTEXITCODE" }
          } finally {
            Set-Content $iss -Value $orig -NoNewline
          }
          Get-ChildItem build\windows\Venera-*arm64* -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: venera-windows-arm64
          path: |
            build/dist/*.zip
            build/windows/Venera-*arm64*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 摘要
        shell: pwsh
        run: |
          @"
          ### Windows ARM64 构建完成
          - Flutter: ${{ inputs.flutter_version }} (native arm64 Dart ${{ inputs.dart_version }})
          - 版本: $env:VERSION
          - 产物: build/dist/Venera-$env:VERSION-windows-arm64.zip
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
